<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>jsonp</title>
</head>

<body>
<pre>
    html标签的src属性没有同源限制（支持跨域），浏览器解析script标签时，会自动下载src属性值（url）指向的资源；
    script标签指向的资源文件被下载后，其中的内容会被立即执行；
    服务器端的程序会解析src属性值中的url传递的参数，根据这些参数针对性返回一个/多个函数调用表达式，这些函数调用表达式的参数就是客户端跨域想得到的数据；
    服务器生成、返回的文件中，表达式调用的函数是已经在本地提前定义好的，而参数就是希望从跨域服务器拿到的数据。
    字面的script标签可以，动态添加到dom树中的script也可以，后者更方便绑定事件。
</pre>
</body>
<script>
    function jsonp(url, data) {
        return new Promise((resolve, reject) => {
            // 1.将传入的data数据转化为url字符串形式
            var queryString = url.indexOf("?") == -1 ? "?" : "&";
            var arr = []
            for (var key in data) {
                arr.push(key + "=" + encodeURIComponent(data[key]))
            }
            queryString += arr.join("&");
            // 2.处理url中的回调函数
            var callbackName =
                "jsonp_callback_" +
                Math.random()
                    .toString(16)
                    .replace(".", "");
            queryString += "&callback=" + callbackName;

            // 3.创建一个script标签并插入到页面中
            var script = document.createElement("script");
            script.src = url + queryString;

            // 4.挂载回调函数
            window[callbackName] = function (data) {
                resolve(data);
                // 处理完回调函数的数据之后，删除jsonp的script标签
                document.body.removeChild(script);
            };

            document.body.appendChild(script);
        });
    }

    jsonp('http://127.0.0.1:3000/show', { name: '测试', age: 20 }).then((res) => {
        console.log(res)
    }).catch((err) => {
        console.log('xx===')
        console.log(err)
    })
</script>

</html>
