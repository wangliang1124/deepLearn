<body>
    <H3>深克隆 deepClone</H3>
    <pre>

    </pre>

    <script>
        function deepClone(obj, map = new Map()) {
            if (!obj || typeof obj !== "object") {
                return obj;
            }

            if (obj.nodeType && 'cloneNode' in obj) {
                return obj.cloneNode(true)
            }

            // 命中缓存说明是循环引用，返回此前创建的克隆（返回 obj 会把源对象的引用带进结果里）
            if (map.has(obj)) {
                return map.get(obj);
            }

            var result;
            switch (Object.prototype.toString.call(obj)) {
                case "[object Array]":
                    result = [];
                    map.set(obj, result);
                    for (let v of obj) {
                        result.push(deepClone(v, map));
                    }
                    return result;

                case "[object Object]":
                    result = obj.constructor ? new obj.constructor() : {};
                    map.set(obj, result);
                    for (const k in obj) {
                        result[k] = deepClone(obj[k], map);
                    }
                    return result;

                case "[object Date]":
                    return new Date(obj.getTime());

                case "[object RegExp]":
                    var flags = "";
                    if (obj.global) flags += "g";
                    if (obj.multiline) flags += "m";
                    if (obj.ignoreCase) flags += "i";
                    return new RegExp(obj.source, flags);

                default:
                    return obj;
            }
        }

        function Test(props) {
            this.props = props;
        }

        var test = {
            name: 'wangliang',
            birth: new Date(),
            pattern: /wangliang/gim,
            container: document.body,
            hobbys: ['book', new Date(), /aaa/gim, 111]
        };

        var source = new Test(test);
        var clone = deepClone(source);
        console.log(source.props.birth === clone.props.birth);
        console.log(source);
        console.log(clone);

        const target = {
            field1: 1,
            field2: undefined,
            field3: {
                child: 'child'
            },
            field4: [2, 4, 8]
        };
        target.target = target;
        console.log(deepClone(target))
    </script>
</body>
